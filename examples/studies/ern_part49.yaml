# Early Retirement Now Part 49: Using Leverage in Retirement
#
# Studies the impact of margin-loan leverage on SWR success rates.
# Uses the Part 49 withdrawal policy (portfolio_withdrawal + loan_draw).
#
# ERN Part 49 methodology:
#   - 3% portfolio withdrawal + 1% loan draw = 4% total spending
#   - 75/25 stock/bond allocation
#   - 30-year horizon
#   - Real interest rates: 0%, 1.5%, 3% (this config uses 1.5%)
#   - LTV observed but NOT enforced (no forced liquidation at 75%)
#
# Grid: 1 equity_allocation x 1 SWR x 1 horizon (30y) = 1 cell
# Each cell runs over rolling cohorts from the ERN dataset.
#
# Run example:
#   sim-retire --data-dir data/ern run examples/studies/ern_part49.yaml \
#     --no-persist --summary-only

metadata:
  name: "ERN Part 49 — Using Leverage in Retirement"
  version: "2.0"
  description: >
    Early Retirement Now Part 49 replication:
    impact of margin-loan leverage on SWR success rates.
    Uses ERN methodology: 3% portfolio + 1% loan = 4% total spending.
    LTV observation only, no forced liquidation.

dataset:
  identifier: "ern_swr_h720"

cohorts:
  horizon_years: [30]

allocation_policy:
  type: "ConstantAllocationPolicy"
  equity_allocation: [0.75]

withdrawal_policy:
  type: "Part49WithdrawalPolicy"
  withdrawal_rate: [0.03]

# Part 49 leverage configuration
# ERN uses real interest rates: 0%, 1.5%, 3%
# This config uses the primary scenario: 1.5% real
debt:
  interest_rate: 0.015
  ltv_limit: 0.75
  ltv_enforcement: false
  loan_draw_rate: 0.01
