  - { experiment: B, strategy: "gp_060_100_0.003_passive", metric: "p05", horizon_years: 60, final_value_target: "0", cape_regime: "HIGH", published: "3.57", unit: percent, note: "range_min" }
  - { experiment: B, strategy: "gp_060_100_0.004_passive", metric: "p05", horizon_years: 60, final_value_target: "0", cape_regime: "HIGH", published: "3.63", unit: percent, note: "range_max" }
  - { experiment: B, strategy: "gp_060_100_0.003_active", metric: "p05", horizon_years: 60, final_value_target: "0", cape_regime: "HIGH", published: "3.57", unit: percent, note: "range_min" }
  - { experiment: B, strategy: "gp_060_100_0.004_active", metric: "p05", horizon_years: 60, final_value_target: "0", cape_regime: "HIGH", published: "3.63", unit: percent, note: "range_max" }

