# ERN Part 19 — T3.2 Experiment B E2E audit specification.
#
# Authoritative machine-readable audit matrix for
# docs/research/ern_part19_replication.md Experiment B.
#
# Distinction:
# - examples/studies/ern_part19.yaml remains the canonical CLI 90-cell
#   study. This file is the audit matrix only.
# - Part 19 Experiment B publishes explicit numerical values for failsafe
#   and percentile SWRs (Table in §9.2 of replication doc).
# - Validation uses structural/computational checks + published anchors
#   + cross-validation against Part 20 Experiment A for the 45 overlapping cells.
#
# All monetary and rate values are quoted strings so Decimal parsing is
# exact. `unit` drives discrepancy classification quantum:
#   percent     → 0.01  (2-decimal percent, Table 02/03/06)
#   percent_1dp → 0.1   (1-decimal percent, allocation checkpoints)
#   usd         → 1     (exact dollar checkpoints)

meta:
  name: "ERN Part 19 T3.2 Experiment B E2E Audit"
  spec_version: "1.0"
  notes: >
    Part 19 Experiment B: Failsafe/Percentile SWR analysis.
    45 strategies (21 static + 24 glidepaths) × 2 CAPE conditions = 90 cells.
    Horizon: 60 years. FV target: 0%. Cohorts: 1,739 canonical.
    Primary validation: structural + computational + published anchors + cross-validation vs Part 20 Experiment A.

structural_counts:
  total_cohorts: 1739
  cape_available: 1485
  cape_high: 383
  strategy_count: 45
  static_count: 21
  glidepath_count: 24
  fv_targets: 1
  cape_conditions: 2
  horizon_years: 60
  cells: 90

experiments:
  - id: B
    kind: percentile_search
    horizon_years: 60
    populations: ["ALL", "HIGH"]
    fv_targets: ["0"]
    cells: 90

# ---------------------------------------------------------------------------
