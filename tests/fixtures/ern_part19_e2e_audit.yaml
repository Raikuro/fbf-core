  # --- Anchor 2: CAPE > 20, 60→100% glidepath failsafe range = 3.42%–3.47% (Table) ---
  # Four glidepath variants: gp_060_100_0.003_passive, gp_060_100_0.004_passive,
  # gp_060_100_0.003_active, gp_060_100_0.004_active
  - { experiment: B, strategy: "gp_060_100_0.003_passive", metric: "failsafe", horizon_years: 60, final_value_target: "0", cape_regime: "HIGH", published: "3.42", unit: percent, note: "range_min" }
