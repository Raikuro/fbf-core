  - { experiment: B, strategy: "gp_060_100_0.003_active", metric: "failsafe", horizon_years: 60, final_value_target: "0", cape_regime: "HIGH", published: "3.42", unit: percent, note: "range_min" }
  - { experiment: B, strategy: "gp_060_100_0.004_active", metric: "failsafe", horizon_years: 60, final_value_target: "0", cape_regime: "HIGH", published: "3.47", unit: percent, note: "range_max" }

  # --- Anchor 3: CAPE > 20, static 80% equity 5th percentile = 3.47% (Table) ---
  - { experiment: B, strategy: "static_080", metric: "p05", horizon_years: 60, final_value_target: "0", cape_regime: "HIGH", published: "3.47", unit: percent }

