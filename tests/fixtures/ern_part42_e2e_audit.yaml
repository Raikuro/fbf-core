# ERN Part 42 — T5.1 Published-Table Replication Audit Specification
#
# Authoritative machine-readable audit matrix for ERN Part 42 Tables 01–05.
# This fixture contains the transcribed published table cells from
# docs/research/ern_part42_replication.md §10.2.
#
# The E2E test will:
# 1. Execute the experiment configurations corresponding to each scenario
# 2. Aggregate cohort-level results into the same table cells (decade/conditioning)
# 3. Compare against the published values below with documented precision
# 4. Classify discrepancies per the roadmap taxonomy (REPRODUCED / EXPLAINED DIFFERENCE / UNEXPLAINED DIFFERENCE / CAPABILITY GAP)
#
# Distinction: examples/studies/ern_part42.yaml defines the 45-cell structural grid
# (5 equity × 9 SWR × 1 horizon). This file is the published-anchor audit matrix.

meta:
  name: "ERN Part 42 T5.1 Published-Table Replication Audit"
  spec_version: "1.0"
  source_article: "https://earlyretirementnow.com/2021/01/13/one-more-year-swr-series-part-42/"
  source_tables: "Tables 01–05"
  transcription_source: "docs/research/ern_part42_replication.md §10.2"
  notes: >
    Frozen audit specification. All monetary values quoted as strings for exact Decimal parsing.
    Precision is taken from the published table display (not invented).
    unit field drives discrepancy classification quantum:
      usd         → exact dollar (Tables 02–05)
      percent     → 0.01 (2-decimal percent, Table 01)
      percent_2dp → 0.01 (2-decimal percent, Rel-to-Base rows)
      percent_1dp → 0.1  (1-decimal percent, not used in Part 42 but defined for consistency)

structural_counts:
  # Cohort universe for 30Y+OMY (12 accumulation + 360 retirement = 373 months)
  # ern_swr_h720 has 2459 snapshots: 2459 - 373 + 1 = 2087 cohorts
  cohorts_30y_omy: 2087
  # Cohort universe for 50Y (no OMY, 600 months)
  # 2459 - 600 + 1 = 1860 cohorts
  cohorts_50y: 1860
  # Cohort universe for 50Y+OMY (12 accumulation + 600 retirement = 613 months)
  # 2459 - 613 + 1 = 1847 cohorts
  cohorts_50y_omy: 1847
  decades: 9  # 1920s through 2000s
  scenarios_table01: 11
  scenarios_tables_02_05: 7  # core scenarios; Table 05 adds 2-year delay = 10 total

# ---------------------------------------------------------------------------
# Experiment-to-Scenario Mapping
# ---------------------------------------------------------------------------
# These define the simulation configurations that produce each table column.
# The E2E test uses these to construct the appropriate study plans.
# OMY = One More Year (12-month accumulation phase before retirement)

experiments:
  # --- Failsafe Experiments (binary search for maximum sustainable withdrawal) ---
  - id: A
    name: "30Y Failsafe Baseline"
    description: "30-year horizon, 75/25, FV=25%, no OMY"
    horizon_years: 30
    fv_target: "0.25"
    omy: false
    omy_contribution: 0
    social_security: false
    table_scenario: "Baseline"  # Maps to Table 01 row 1, Table 02 Baseline, Table 03 Baseline, Table 04 Baseline (30Y), Table 05 Baseline (30Y)

  - id: B
    name: "30Y OMY Delay Only"
    description: "30-year horizon, 75/25, FV=25%, OMY 12 months no contributions"
    horizon_years: 30
    fv_target: "0.25"
    omy: true
    omy_contribution: 0
    social_security: false
    table_scenario: "Delay RE 1Y"  # Maps to Table 01 row 2, Table 03 Delay RE 1Y, Table 04 Delay RE 1Y (30Y), Table 05 Delay RE 1Y (30Y)

  - id: C
    name: "30Y OMY + Contributions"
    description: "30-year horizon, 75/25, FV=25%, OMY 12 months + $5k/month"
    horizon_years: 30
    fv_target: "0.25"
    omy: true
    omy_contribution: 5000
    social_security: false
    table_scenario: "$5k/m contributions"  # Maps to Table 01 row 3, Table 03 $5k/m, Table 04 $5k/m (30Y), Table 05 $5k/m (30Y)

  - id: D
    name: "50Y Failsafe Baseline"
    description: "50-year horizon, 75/25, FV=0%, no OMY"
    horizon_years: 50
    fv_target: "0.0"
    omy: false
    omy_contribution: 0
    social_security: false
    table_scenario: "50Y Baseline"  # Maps to Table 01 row 4, Table 04 50Y Baseline, Table 05 50Y Baseline

  - id: E_delay
    name: "50Y OMY Delay Only"
    description: "50-year horizon, 75/25, FV=0%, OMY 12 months no contributions"
    horizon_years: 50
    fv_target: "0.0"
    omy: true
    omy_contribution: 0
    social_security: false
    table_scenario: "Delay RE 1Y (50Y)"  # Maps to Table 01 row 5, Table 04 Delay RE 1Y (50Y), Table 05 Delay RE 1Y (50Y)

  - id: E_contrib
    name: "50Y OMY + Contributions"
    description: "50-year horizon, 75/25, FV=0%, OMY 12 months + $5k/month"
    horizon_years: 50
    fv_target: "0.0"
    omy: true
    omy_contribution: 5000
    social_security: false
    table_scenario: "$5k/m contributions (50Y)"  # Maps to Table 01 row 6, Table 04 $5k/m (50Y), Table 05 $5k/m (50Y)

  - id: F_baseline
    name: "50Y + Social Security Baseline"
    description: "50-year horizon, 75/25, FV=0%, $3k/month SS years 31–50"
    horizon_years: 50
    fv_target: "0.0"
    omy: false
    omy_contribution: 0
    social_security: true
    ss_start_year: 31
    ss_amount_monthly: 3000
    table_scenario: "50Y Baseline + SocSec"  # Maps to Table 01 row 7, Table 05 50Y Base + SocSec

  - id: F_delay
    name: "50Y + Social Security OMY Delay Only"
    description: "50-year horizon, 75/25, FV=0%, OMY 12 months no contributions, $3k/month SS years 31–50"
    horizon_years: 50
    fv_target: "0.0"
    omy: true
    omy_contribution: 0
    social_security: true
    ss_start_year: 31
    ss_amount_monthly: 3000
    table_scenario: "Delay RE 1Y (50Y+SocSec)"  # Maps to Table 01 row 8, Table 05 Delay RE 1Y (50Y+SocSec)

  - id: F_contrib
    name: "50Y + Social Security OMY + Contributions"
    description: "50-year horizon, 75/25, FV=0%, OMY 12 months + $5k/month, $3k/month SS years 31–50"
    horizon_years: 50
    fv_target: "0.0"
    omy: true
    omy_contribution: 5000
    social_security: true
    ss_start_year: 31
    ss_amount_monthly: 3000
    table_scenario: "$5k/m contributions (50Y+SocSec)"  # Maps to Table 01 row 9, Table 05 $5k/m (50Y+SocSec)

  - id: G_2yr
    name: "2-Year Delay"
    description: "50-year horizon, 75/25, FV=0%, 24-month OMY + $5k/month, $3k/month SS years 31–50"
    horizon_years: 50
    fv_target: "0.0"
    omy: true
    omy_duration_months: 24
    omy_contribution: 5000
    social_security: true
    ss_start_year: 31
    ss_amount_monthly: 3000
    table_scenario: "2-year delay"  # Maps to Table 01 row 10, Table 05 2-year delay

  # --- Fixed-4% Failure Rate Experiment (no binary search) ---
  - id: G
    name: "Fixed 4% Failure Rates"
    description: "Fixed 4% × $2M = $80,000/year withdrawal, evaluate failure probability"
    horizon_years: 30  # Primary horizon for Table 01 first 3 rows; 50Y for rows 4–10
    fv_target: "0.25"  # 30Y uses 25%; 50Y uses 0%
    withdrawal_rate: "0.04"
    fixed_withdrawal: true
    table_scenario: "Table01"  # Special marker: uses all 11 scenario rows with conditioning

