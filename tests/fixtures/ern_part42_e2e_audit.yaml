# ---------------------------------------------------------------------------
# Aggregation Definitions
# ---------------------------------------------------------------------------
# These define how cohort-level results are aggregated into the published table cells.

aggregation:
  decade:
    description: "Group cohorts by start decade (1920s = 1920-01 to 1929-12, etc.)"
    method: "min"  # Published tables show minimum failsafe per decade
    decade_mapping:
      "1920s": [1920, 1929]
      "1930s": [1930, 1939]
      "1940s": [1940, 1949]
      "1950s": [1950, 1959]
      "1960s": [1960, 1969]
      "1970s": [1970, 1979]
      "1980s": [1980, 1989]
      "1990s": [1990, 1999]
      "2000s": [2000, 2009]

  conditioning_table01:
    description: "Filter cohorts by condition, compute failure rate = failed / total"
    conditions:
      All: "all cohorts"
      Since_1926: "cohorts starting 1926-01 or later"
      Since_1950: "cohorts starting 1950-01 or later"
      CAPE_le_20: "CAPE ≤ 20 at cohort start (pre-OMY for OMY scenarios)"
      CAPE_gt_20: "CAPE > 20 at cohort start (pre-OMY for OMY scenarios)"
      SP500_High: "S&P 500 within 10% of all-time high at cohort start"
      Drdwn_0_10: "S&P 500 drawdown 0–10% below ATH at cohort start"
      Drdwn_10_20: "S&P 500 drawdown 10–20% below ATH at cohort start"
      Drdwn_20_30: "S&P 500 drawdown 20–30% below ATH at cohort start"
      Drdwn_gt_30: "S&P 500 drawdown >30% below ATH at cohort start"
    method: "failure_rate"
    precision: "0.1"  # percentage points

  relative_improvement:
    description: "(OMY_scenario / Baseline) - 1, expressed as percentage"
    formula: "(value / baseline_value - 1) * 100"
    precision: "0.01"  # percentage points (2 decimal places)

# ---------------------------------------------------------------------------
# Data Vintage Note
# ---------------------------------------------------------------------------
# The ERN Part 42 article was published January 2021.
# The canonical FBF market data (data/ern/) was extracted from the ERN Google Sheet
# on 2026-09-15 and includes historical data through 2026-06 with forward extrapolation.
# The article's cohort universe ends December 2015 (for 30Y/50Y horizons).
# The additional historical data (2016-2026) does not affect the cohort universe used
# for the published tables but may affect forward extrapolation behavior.
# Discrepancies should be evaluated against this known vintage difference.

data_vintage:
  article_date: "2021-01-13"
  canonical_data_extraction_date: "2026-09-15"
  canonical_historical_end: "2026-06"
  article_cohort_end: "2015-12"
  note: "Canonical data includes ~10.5 years of additional historical observations not available to the 2021 article. This is a known replication variable."
