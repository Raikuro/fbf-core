# ERN Part 20 — T2.1 baseline E2E audit specification.
#
# Authoritative machine-readable audit matrix for
# docs/research/ern_part20_e2e_audit.md Experiments A–E.
#
# Distinction (constraint: no matrix duplication):
# - examples/studies/ern_part20.yaml remains the canonical CLI 320-cell
#   grid study (32 glidepaths × 5 SWR × 2 horizons). It is intentionally
#   NOT extended to Experiments A–E; this file is the audit matrix only.
# - `anchors` below are external reference data transcribed from
#   docs/research/ern_part20_replication.md §11.1–§11.6 and §15.4
#   (published values at displayed precision). They are validation
#   anchors, not a second experiment matrix (audit §11).
#
# All monetary and rate values are quoted strings so Decimal parsing is
# exact. `unit` drives discrepancy classification quantum:
#   percent     → 0.01  (2-decimal percent, Tables 02/03/06)
#   percent_1dp → 0.1   (1-decimal percent, allocation checkpoints)
#   usd         → 1     (exact dollar checkpoints, Tables 01/05)

meta:
  name: "ERN Part 20 T2.1 Baseline E2E Audit"
  spec_version: "1.0"
  notes: >
    Frozen audit specification (ern_part20_e2e_audit.md §2–§7).
    Strategy universe lives in fbf.core.research.part20_strategies
    (production catalog: 21 static + 32 glidepath). Population
    conditioning is derived from the canonical Part 3 cohort manifest.
    Experiment E is declarative capability-gap only — never executed.

structural_counts:
  total_cohorts: 1739
  cape_available: 1485
  cape_high: 383
  strategy_count: 53
  cells_a: 106
  cells_b: 106
  cells_c: 530
  cells_d: 159
  cells_e_cases: 4

experiments:
  - id: A
    kind: percentile_search
    horizon_years: 60
    populations: ["HIGH", "LOW"]
    fv_targets: ["0"]
    cells: 106

  - id: B
    kind: percentile_search
    horizon_years: 30
    populations: ["HIGH", "LOW"]
    fv_targets: ["0"]
    cells: 106

  - id: C
    kind: fixed_swr
    horizons_years: [60, 30]
    fixed_swrs: ["0.03", "0.0325", "0.035", "0.0375", "0.04"]
    population: "HIGH"
    final_value_target: "0"
    cells: 530

  - id: D
    kind: percentile_search
    horizon_years: 60
    populations: ["HIGH"]
    fv_targets: ["0", "0.5", "1"]
    reuse_from: "A"
    cells: 159

  - id: E
    kind: unsupported
    cells: 4
    capability_gaps:
      - >-
        annual rebalancing frequency not exposed as an execution frequency
        (monthly portfolio rebalance only; domain has WithdrawalFrequency.ANNUAL
        but no annual rebalance step schedule)
      - >-
        synthetic Bear→Bull / Bull→Bear return sequences are not a supported
        canonical dataset configuration
      - >-
        case-study intermediate allocations/year-2 checkpoints require
        annual-rebalance mechanics
    cases:
      - id: bear_bull_glidepath
        strategy: "gp_070_090_annual"
        sequence: "bear_bull"
      - id: bear_bull_static_080
        strategy: "static_080"
        sequence: "bear_bull"
      - id: bull_bear_glidepath
        strategy: "gp_070_090_annual"
        sequence: "bull_bear"
      - id: bull_bear_static_080
        strategy: "static_080"
        sequence: "bull_bear"

