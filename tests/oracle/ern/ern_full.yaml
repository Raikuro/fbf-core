# Full ERN grid: 5 equity allocations x 9 rates x 4 horizons x 5 FV targets.
#
# 5 x 9 x 4 x 5 = 900 cells
# x ~2099 cohorts per cell (30y) = ~1,889,100 total units
#
# Classification: canonical benchmark / manual validation artifact.
# This file is NOT referenced by pytest. It is the single canonical
# definition of the full ERN study, intended for:
#   - Manual validation runs via:
#       sim-retire --data-dir data/ern run tests/oracle/ern/ern_full.yaml
#   - Performance benchmarking
#   - Future automated slow-E2E integration (when a consumer is added)
#
# Do NOT split this into separate per-FV-target files. The architecture
# treats final_value_target as an evaluation dimension of one study.

metadata:
  name: "ERN Full Grid"
  version: "1.0"
  description: "5x9x4 grid with 5 final-value targets = 900 cells"

dataset:
  identifier: "ern_swr_h720"

cohorts:
  horizon_years: [30, 40, 50, 60]

allocation_policy:
  type: "ConstantAllocationPolicy"
  equity_allocation: [1.0, 0.75, 0.5, 0.25, 0.0]

withdrawal_policy:
  type: "FixedRealWithdrawalPolicy"
  withdrawal_rate: [0.03, 0.0325, 0.035, 0.0375, 0.04, 0.0425, 0.045, 0.0475, 0.05]

final_value_target: [0.0, 25.0, 50.0, 75.0, 100.0]
